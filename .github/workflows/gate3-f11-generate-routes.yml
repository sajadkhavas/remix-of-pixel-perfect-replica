name: Gate 3 F11 Generate Routes

on:
  push:
    branches:
      - phase/f11-content-trust-legal

permissions:
  contents: write

jobs:
  generate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase/f11-content-trust-legal
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun x prettier --write src/routes src/components/content src/content/trust tests/quality/f11-content-policy.test.ts src/routeTree.gen.ts
      - run: |
          git rm .github/workflows/gate3-f11-generate-routes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(f11): generate routes and format content pages" || true
          git push origin HEAD:phase/f11-content-trust-legal
