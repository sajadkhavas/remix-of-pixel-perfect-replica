name: Frontend Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "phase/**"
      - "integration/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install, validate, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
          check-latest: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Record toolchain
        run: |
          node --version
          bun --version

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Resolve formatting comparison base
        id: format-base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail

          base=""
          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" ]]; then
            base="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "main" ]]; then
            if [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]] && git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
              base="$PUSH_BEFORE_SHA"
            fi
          else
            base="$(git merge-base HEAD origin/main || true)"
          fi

          if [[ -z "$base" ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi

          echo "FORMAT_BASE_REF=$base" >> "$GITHUB_ENV"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Formatting comparison base: $base"

      - name: Check changed-file formatting
        run: bun run format:check

      - name: Lint source
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test:run

      - name: Smoke test development server
        shell: bash
        run: |
          set -Eeuo pipefail

          log_file="${RUNNER_TEMP}/vite-dev.log"
          bun run dev --host 127.0.0.1 --port 4174 > "$log_file" 2>&1 &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4174/ > /dev/null; then
              echo "Development server responded successfully."
              exit 0
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Development server exited before becoming ready."
              cat "$log_file"
              exit 1
            fi

            sleep 1
          done

          echo "Development server did not become ready within 30 seconds."
          cat "$log_file"
          exit 1

      - name: Build production bundles
        run: bun run build

      - name: Write quality summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Frontend quality gate"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Node: \`$(node --version 2>/dev/null || echo unavailable)\`"
            echo "- Bun: \`$(bun --version 2>/dev/null || echo unavailable)\`"
            echo "- Formatting base: \`${FORMAT_BASE_REF:-unresolved}\`"
            echo "- Result: inspect the individual job steps above; no gate uses continue-on-error."
          } >> "$GITHUB_STEP_SUMMARY"
