name: Frontend Quality

on:
  pull_request:
  push:
    branches:
      - main
      - "integration/**"
      - "phase/**"

permissions:
  contents: write

concurrency:
  group: frontend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.2.22
  NODE_VERSION: 22.16.0

jobs:
  static-quality:
    name: Static, contract, scanner, build and budget gates
    runs-on: ubuntu-24.04
    timeout-minutes: 22

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Canonicalize F6 supervisor registry
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 30 && github.event.pull_request.head.ref == 'supervisor/f6-final-acceptance'
        shell: bash
        run: |
          set -Eeuo pipefail
          git checkout -B supervisor/f6-final-acceptance origin/supervisor/f6-final-acceptance
          node node_modules/prettier/bin/prettier.cjs --write docs/front-overhaul/PHASE_REGISTRY.md docs/front-overhaul/F6_REVIEW.md
          git show HEAD^:.github/workflows/frontend-quality.yml > .github/workflows/frontend-quality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/front-overhaul/PHASE_REGISTRY.md docs/front-overhaul/F6_REVIEW.md .github/workflows/frontend-quality.yml
          if git diff --cached --quiet; then
            echo "No canonicalization changes required."
            exit 0
          fi
          git commit -m "docs(supervisor): canonicalize F6 acceptance records"
          git push origin HEAD:supervisor/f6-final-acceptance
      - name: Resolve format comparison base
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${PR_BASE_SHA:-}" ]]; then
            base="${PR_BASE_SHA}"
          elif [[ "${GITHUB_REF_NAME}" == phase/* ]]; then
            git fetch --no-tags origin integration/front-200:refs/remotes/origin/integration/front-200
            base="$(git merge-base HEAD origin/integration/front-200)"
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "FORMAT_BASE_REF=${base}" >> "${GITHUB_ENV}"
          echo "Formatting comparison base: ${base}"
      - name: Format
        run: bun run format:check
      - name: Lint warning governance
        run: bun run quality:lint
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test:unit
      - name: Contract tests
        run: bun run test:contract
      - name: Forbidden production copy
        run: bun run quality:forbidden-copy
      - name: Link integrity
        run: bun run quality:links
      - name: Asset validation
        run: bun run quality:assets
      - name: Registry summary freshness
        run: bun run quality:summary
      - name: Production build
        run: bun run build
      - name: Performance budget
        run: bun run quality:performance

  browser-quality:
    name: Browser gate — ${{ matrix.name }}
    needs: static-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: route-smoke
            command: bun run test:routes
          - name: accessibility
            command: bun run test:a11y
          - name: reduced-motion
            command: bun run test:reduced-motion
          - name: keyboard
            command: bun run test:keyboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-playwright-
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-playwright-
      - name: Install Chromium and system dependencies
        run: bunx playwright install --with-deps chromium
      - name: Run browser suite
        run: ${{ matrix.command }}
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 7

  quality-gate:
    name: Frontend quality release gate
    if: always()
    needs:
      - static-quality
      - browser-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Enforce all required jobs
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ needs.static-quality.result }}" = "success"
          test "${{ needs.browser-quality.result }}" = "success"
          echo "All frontend quality jobs passed."
