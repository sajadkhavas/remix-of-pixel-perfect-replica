name: Gate 2 Format Once

on:
  push:
    branches:
      - integration/front-200

permissions:
  contents: write

jobs:
  format-wave-two:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v5
        with:
          ref: integration/front-200
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format all Gate 2 changes
        env:
          FORMAT_BASE_REF: b0d8e9ba1d0156d18ccb68258a9a650490931d89
        run: bun run format
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/gate2-format-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No formatting changes were needed.'
            exit 0
          fi
          git commit -m 'style(gate2): normalize integrated Wave 2 files'
          git push origin HEAD:integration/front-200
