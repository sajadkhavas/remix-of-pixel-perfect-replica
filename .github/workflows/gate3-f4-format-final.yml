name: Gate 3 F4 Format Final

on:
  push:
    branches:
      - phase/f4-global-shell-navigation

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase/f4-global-shell-navigation
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - run: bun install --frozen-lockfile
      - run: bun x prettier --write src/components/layout/store-settings-runtime.ts src/components/layout/store-settings-context.ts src/components/layout/navigation-model.ts src/routes/__root.tsx
      - run: |
          git rm .github/workflows/gate3-f4-format-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(f4): finalize shell formatting" || true
          git push origin HEAD:phase/f4-global-shell-navigation
