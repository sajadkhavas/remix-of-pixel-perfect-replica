name: Gate 2 Registration Format Once

on:
  push:
    branches:
      - integration/front-200

permissions:
  contents: write

jobs:
  format-registration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v5
        with:
          ref: integration/front-200
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format Gate 2 registration state
        env:
          FORMAT_BASE_REF: f8e48e839a7ac43a5b7088254dde4441c4232c35
        run: bun run format
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/gate2-register-format-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No formatting changes were needed.'
            exit 0
          fi
          git commit -m 'style(gate2): format review and registry records'
          git push origin HEAD:integration/front-200
