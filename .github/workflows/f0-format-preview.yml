name: F0 Owned Formatter

on:
  push:
    branches:
      - phase/f0-production-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - run: bun install --frozen-lockfile
      - name: Format owned build fixes
        run: bunx prettier --write src/components/sections/HeroSection.tsx src/components/sections/CategoriesSection.tsx
      - name: Commit formatted sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/sections/HeroSection.tsx src/components/sections/CategoriesSection.tsx
          if git diff --cached --quiet; then
            echo "Owned files are already formatted."
            exit 0
          fi
          git commit -m "style(f0): format owned build fixes"
          git push origin HEAD:phase/f0-production-foundation
