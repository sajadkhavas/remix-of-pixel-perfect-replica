name: F0 Changed-File Formatter

on:
  push:
    branches:
      - phase/f0-production-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - run: bun install --frozen-lockfile
      - name: Format F0 changed files
        run: bun run format
      - name: Commit formatted F0 files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows \
            docs/front-overhaul \
            eslint.config.js \
            package.json \
            scripts \
            tests \
            src/components/sections/HeroSection.tsx \
            src/components/sections/CategoriesSection.tsx
          if git diff --cached --quiet; then
            echo "F0 changed files are already formatted."
            exit 0
          fi
          git commit -m "style(f0): format foundation files"
          git push origin HEAD:phase/f0-production-foundation
