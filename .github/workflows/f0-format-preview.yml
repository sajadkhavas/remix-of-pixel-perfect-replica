name: F0 Format Preview

on:
  push:
    branches:
      - phase/f0-production-foundation

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - run: bun install --frozen-lockfile
      - name: Format owned build fixes
        run: bunx prettier --write src/components/sections/HeroSection.tsx src/components/sections/CategoriesSection.tsx
      - name: Emit formatted sources
        shell: bash
        run: |
          echo '===HERO_BASE64_BEGIN==='
          base64 -w 0 src/components/sections/HeroSection.tsx
          echo
          echo '===HERO_BASE64_END==='
          echo '===CATEGORIES_BASE64_BEGIN==='
          base64 -w 0 src/components/sections/CategoriesSection.tsx
          echo
          echo '===CATEGORIES_BASE64_END==='
