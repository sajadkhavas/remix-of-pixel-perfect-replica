name: F0 Baseline Audit

on:
  push:
    branches:
      - phase/f0-production-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f0-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Baseline quality audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Record toolchain
        run: |
          node --version
          bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run baseline diagnostics
        shell: bash
        run: |
          set +e
          : > f0-baseline-audit.txt
          failures=0

          run_check() {
            name="$1"
            shift
            echo "===== ${name} =====" | tee -a f0-baseline-audit.txt
            "$@" 2>&1 | tee -a f0-baseline-audit.txt
            status=${PIPESTATUS[0]}
            echo "STATUS=${status}" | tee -a f0-baseline-audit.txt
            echo | tee -a f0-baseline-audit.txt
            if [ "$status" -ne 0 ]; then
              failures=$((failures + 1))
            fi
          }

          run_check "FORMAT" bunx prettier --check .
          run_check "LINT" bun run lint
          run_check "TYPECHECK" bunx tsc --noEmit
          run_check "TEST" bun test --pass-with-no-tests
          run_check "BUILD" bun run build

          echo "FAILURES=${failures}" | tee -a f0-baseline-audit.txt
          exit "$failures"

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f0-baseline-audit
          path: f0-baseline-audit.txt
          if-no-files-found: warn
          retention-days: 7
