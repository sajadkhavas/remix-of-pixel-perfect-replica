name: F14A Workspace Bootstrap

on:
  push:
    branches:
      - phase/f14a-quality-harness

permissions:
  contents: read

concurrency:
  group: f14a-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-workspace:
    name: Export deterministic F14A workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Package repository and Bun binary
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${RUNNER_TEMP}/f14a-workspace"
          tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=test-results --exclude=playwright-report \
            -czf "${RUNNER_TEMP}/f14a-workspace/repository.tar.gz" .
          cp "$(command -v bun)" "${RUNNER_TEMP}/f14a-workspace/bun"
          chmod 0755 "${RUNNER_TEMP}/f14a-workspace/bun"
          sha256sum "${RUNNER_TEMP}/f14a-workspace/repository.tar.gz" \
            "${RUNNER_TEMP}/f14a-workspace/bun" \
            > "${RUNNER_TEMP}/f14a-workspace/SHA256SUMS"

      - name: Upload workspace artifact
        uses: actions/upload-artifact@v4
        with:
          name: f14a-workspace-${{ github.sha }}
          path: ${{ runner.temp }}/f14a-workspace
          if-no-files-found: error
          retention-days: 1
