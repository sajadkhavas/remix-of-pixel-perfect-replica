name: F14A Lockfile Sync

on:
  push:
    branches:
      - phase/f14a-quality-harness
    paths:
      - package.json
      - .github/workflows/f14a-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: f14a-lock-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-lockfile:
    name: Synchronize Bun lockfile
    if: ${{ !contains(github.event.head_commit.message, '[skip lock-sync]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: phase/f14a-quality-harness

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install and update lockfile
        run: bun install

      - name: Commit lockfile when changed
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "test(f14a): sync browser harness lockfile [skip lock-sync]"
          git push origin HEAD:phase/f14a-quality-harness
