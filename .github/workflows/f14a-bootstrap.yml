name: F14A Scanner Baseline Sync

on:
  push:
    branches:
      - phase/f14a-quality-harness
    paths:
      - scripts/quality/**
      - quality/route-coverage.json
      - .github/workflows/f14a-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: f14a-baseline-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-scanner-baselines:
    name: Capture exact scanner debt
    if: ${{ !contains(github.event.head_commit.message, '[skip baseline-sync]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: phase/f14a-quality-harness

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Capture exact source debt
        run: |
          node scripts/quality/forbidden-copy.mjs --write-baseline
          node scripts/quality/link-integrity.mjs --write-baseline

      - name: Commit generated baselines when changed
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- quality/forbidden-copy-baseline.json quality/link-integrity-baseline.json; then
            echo "Scanner baselines already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quality/forbidden-copy-baseline.json quality/link-integrity-baseline.json
          git commit -m "feat(f14a): capture exact scanner debt [skip baseline-sync]"
          git push origin HEAD:phase/f14a-quality-harness
